name: agt002-control-plane

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Hourly drift check independent of code changes: catches a surface that drifted out of
    # band (e.g. a manual hotfix on the Hetzner host) even with no new commit to trigger it.
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # The SHA every surface is compared against. On pull_request, github.sha is the synthetic
  # merge/candidate commit GitHub materializes for the PR -- nothing is ever deployed at that
  # SHA, so binding drift detection to it makes drift_alert impossible to pass. The real target
  # is the current tip of the PR's base branch. On push/schedule/workflow_dispatch, github.sha is
  # the actual commit on main, so it is the correct, authoritative target there.
  AGT002_DESIRED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

jobs:
  agt002_suite:
    name: agt002_suite
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack pnpm install --frozen-lockfile
      # Discover every AGT-002 test, including tender integration tests whose
      # filenames contain (rather than begin with) the subsystem identifier.
      - run: corepack pnpm run test:agt002

  f0_suite:
    name: f0_suite
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack pnpm install --frozen-lockfile
      - run: node --test tests/agt002-f0a-control-plane.test.mjs tests/agt002-f0b-chat-query.test.mjs tests/agt002-f0b-chat-query-rollback-pglite.integration.test.mjs tests/agt002-f0b2-rpc-hardening.test.mjs tests/agt002-f0b2-rpc-hardening-rollback-pglite.integration.test.mjs tests/agt002-f0e-ci-governance.test.mjs tests/agt002-f0e-grants-static.test.mjs tests/agt002-f0-runtime-reporters.test.mjs tests/agt002-f0-drift-detection.test.mjs tests/agt002-f0-users-security-095-pglite.integration.test.mjs

  backend_parity:
    name: backend_parity
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run check:backend-parity

  production_build:
    name: production_build
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run build

  migration_static:
    name: migration_static
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack pnpm install --frozen-lockfile
      - run: node --test tests/agt002-f0b-chat-query.test.mjs tests/agt002-f0b2-rpc-hardening.test.mjs tests/agt002-f0e-grants-static.test.mjs

  grants_security:
    name: grants_security
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run check:agt002-grants

  release_receipt:
    name: release_receipt
    runs-on: ubuntu-latest
    needs:
      - agt002_suite
      - f0_suite
      - backend_parity
      - production_build
      - migration_static
      - grants_security
    # Schedule runs never execute the quality jobs above (they short-circuit on `if:
    # github.event_name != 'schedule'`), so every one of their `needs` reports skipped rather
    # than success. `always()` lets this job proceed anyway so the hourly run can still produce a
    # lightweight receipt for drift_alert to compare against. On pull_request/push/
    # workflow_dispatch, every quality job must have actually run and passed -- this keeps
    # release_receipt a real, fail-closed required check on those triggers.
    if: >
      always() &&
      (
        github.event_name == 'schedule' ||
        (
          needs.agt002_suite.result == 'success' &&
          needs.f0_suite.result == 'success' &&
          needs.backend_parity.result == 'success' &&
          needs.production_build.result == 'success' &&
          needs.migration_static.result == 'success' &&
          needs.grants_security.result == 'success'
        )
      )
    steps:
      # Full history: the receipt computes, per pinned surface (bridge, host jobs), the newest
      # commit that changed the code it runs. A shallow clone would report the shallow boundary
      # commit for every path and make every pinned surface look behind.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack pnpm install --frozen-lockfile
      # --version is derived directly from the same desired-target sha drift_alert observes
      # origin_main against (f0-<first 7 chars>), never trusted from a manually maintained
      # repository variable that could drift out of sync with what is actually on main. The sha
      # is validated as full lowercase 40-hex first, so a malformed desired sha fails this step
      # closed instead of silently deriving a bogus version. --git-sha is that same desired-target
      # SHA (base sha on PR, current sha otherwise), so receipt.desired.sha and the observed
      # origin_main are always bound to the identical target.
      - name: Derive desired version from desired sha
        run: |
          sha="${AGT002_DESIRED_SHA}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "AGT002_DESIRED_SHA is not a full lowercase 40-hex sha: $sha" >&2
            exit 1
          fi
          echo "AGT002_DESIRED_VERSION=f0-${sha:0:7}" >> "$GITHUB_ENV"
      - run: corepack pnpm run agt002:release-receipt -- --out agt002-release-receipt.json --version "$AGT002_DESIRED_VERSION" --git-sha "${{ env.AGT002_DESIRED_SHA }}"
      - uses: actions/upload-artifact@v4
        with:
          name: agt002-release-receipt
          path: agt002-release-receipt.json

  drift_alert:
    name: drift_alert
    runs-on: ubuntu-latest
    needs:
      - release_receipt
    # release_receipt already encodes "schedule OR every quality job succeeded" in its own if, so
    # drift_alert only needs to gate on release_receipt's result -- not re-derive the quality-job
    # logic. Without this explicit always(), a failed/cancelled release_receipt would otherwise be
    # able to leave drift_alert's default success() checks ambiguous across GitHub Actions
    # semantics; this pins it fail-closed regardless.
    if: always() && needs.release_receipt.result == 'success'
    steps:
      # Full history: the drift check verifies that each pinned surface's observed release is a
      # main commit at or after its last code change (git merge-base --is-ancestor).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack pnpm install --frozen-lockfile
      # On pull_request drift_alert runs an explicit offline detector-contract test instead of
      # observing production: it proves checkAgt002Drift's own pass/fail logic is correct, with no
      # network call and no claim about what is actually running. The live observation below only
      # runs on push main, schedule, and workflow_dispatch.
      - name: PR offline drift-detector contract test
        if: github.event_name == 'pull_request'
        run: node --test tests/agt002-f0-drift-detection.test.mjs
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: agt002-release-receipt
          path: .
      # Every input below is an explicit, non-secret configuration value (a repository variable
      # or the run's own desired-target sha) -- never a git/disk inference, never a secret. The
      # desired *version* is derived directly from the desired-target sha (f0-<first 7 chars>).
      # Surfaces observed:
      #   - origin_main: bound to the desired-target sha (GitHub is the authoritative source).
      #   - vercel_production / bridge: their own read-only control-plane URL.
      #   - host jobs (initial_analysis_worker, auto_initial, radar_daily_*, radar_requests): the
      #     bridge's read-only host-surface route, <bridge URL>/<surface>, which reads the systemd
      #     unit's pinned release. No per-surface variable is needed.
      # A surface that cannot be observed is reported as an "unobserved" warning, never as drift
      # and never as fine. A real mismatch fails the job.
      - name: Derive desired version from desired sha
        if: github.event_name != 'pull_request'
        run: |
          sha="${AGT002_DESIRED_SHA}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "AGT002_DESIRED_SHA is not a full lowercase 40-hex sha: $sha" >&2
            exit 1
          fi
          echo "AGT002_DESIRED_VERSION=f0-${sha:0:7}" >> "$GITHUB_ENV"
          echo "AGT002_OBSERVE_ORIGIN_MAIN_VERSION=f0-${sha:0:7}" >> "$GITHUB_ENV"
      - name: Collect observed surfaces
        if: github.event_name != 'pull_request'
        env:
          AGT002_OBSERVE_VERCEL_PRODUCTION_URL: ${{ vars.AGT002_VERCEL_PRODUCTION_CONTROL_PLANE_URL }}
          AGT002_OBSERVE_BRIDGE_URL: ${{ vars.AGT002_BRIDGE_CONTROL_PLANE_URL }}
        run: corepack pnpm run agt002:observe-surfaces -- --desired-sha "${{ env.AGT002_DESIRED_SHA }}" --git-sha "${{ env.AGT002_DESIRED_SHA }}" --desired-version "$AGT002_DESIRED_VERSION" --out agt002-observed-surfaces.json
      - name: Check drift
        if: github.event_name != 'pull_request'
        id: drift
        continue-on-error: true
        run: corepack pnpm run check:agt002-drift -- --receipt agt002-release-receipt.json --observed agt002-observed-surfaces.json --out agt002-drift-result.json
      - name: Upload drift result
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: agt002-drift-result
          path: agt002-drift-result.json
      - name: Fail on drift
        if: steps.drift.outcome == 'failure' && github.event_name != 'pull_request'
        run: exit 1
