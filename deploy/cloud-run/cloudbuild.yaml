# Construye la imagen del SIIO en Cloud Build y la publica en Artifact Registry (psi-siio, us-east5).
# Uso: gcloud builds submit --project psi-siio --region us-east5 --config deploy/cloud-run/cloudbuild.yaml --substitutions=_TAG=<sha>
substitutions:
  _IMAGE: us-east5-docker.pkg.dev/psi-siio/siio/siio
  _TAG: manual
  _SUPABASE_URL: https://tyfzjqzcpgwcjnxozaaf.supabase.co
  # Llave anónima: es pública (va en el navegador). La misma que usa Vercel.
  _SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5ZnpqcXpjcGd3Y2pueG96YWFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NzYzOTksImV4cCI6MjA5MzE1MjM5OX0.cEEnlu8LjwVzOJu8iPrX9_bsHO_zP_aezpzSIKYd2nE
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - -t
      - ${_IMAGE}:${_TAG}
      - .
images:
  - ${_IMAGE}:${_TAG}
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
