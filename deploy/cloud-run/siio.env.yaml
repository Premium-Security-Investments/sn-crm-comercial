# Configuración NO secreta del SIIO en Cloud Run (proyecto psi-siio, us-east5).
# Los secretos van aparte, en Secret Manager (ver deploy/cloud-run/README.md).
# Origen de cada valor, reconstruido el 2026-11-21 porque Vercel no deja leer las variables marcadas «sensitive»:
#   [vercel]   leído con `vercel env pull` (variables no sensibles de producción)
#   [base]     tomado de la base: lo que guardaron los análisis y corridas reales más recientes
#   [código]   valor por defecto del código o constante del contrato
#   [infra]    dirección conocida de la infraestructura
#   (por confirmar) = no hay evidencia directa del valor que tiene hoy Vercel; revisar en la prueba en paralelo.

# Node corta a 16 KB los encabezados de respuesta; algunas consultas a Supabase los superan (en Vercel el límite es mayor).
NODE_OPTIONS: "--max-http-header-size=65536"

NEXT_PUBLIC_SUPABASE_URL: "https://tyfzjqzcpgwcjnxozaaf.supabase.co"          # [infra]

# Análisis de licitaciones (AGT-002)
TENDER_AUTO_ANALYSIS: "on"                                                    # [vercel]
TENDER_CONTINUOUS_DRAIN: "true"                                               # [vercel]
TENDER_IMMEDIATE_DISPATCH: "true"                                             # [vercel]
TENDER_ANALYSIS_ENGINE: "agt002_codex_preview"                                # [código] motor de los trabajos congelados (por confirmar)
TENDER_DURABLE_PIPELINE: "on"                                                 # (por confirmar)
TENDER_PUBLIC_UI: "on"                                                        # (por confirmar)
AGT002_CANONICAL_ONLY: "true"                                                 # [vercel]
AGT002_CONTEXT_V2: "true"                                                     # [vercel]
AGT002_DECISION_AXIS_SURFACE: "true"                                          # [vercel]
AGT002_DOCUMENT_RETRIEVAL: "true"                                             # [vercel]
AGT002_INTEGRAL_CONTRACT_V3: "true"                                           # [vercel]
AGT002_LEGAL_CORPUS: "true"                                                   # [vercel]
AGT002_MESA_CARPETA: "1"                                                      # [vercel]
AGT002_INITIAL_ANALYSIS_ADMISSION_ENABLED: "false"                            # [vercel]
AGT002_MODEL_CALLS_ENABLED: "false"                                           # [vercel]
AGT002_HETZNER_BRIDGE_URL: "https://agt002.5-78-140-24.sslip.io/v1/agt002-preview/run"  # [vercel]
AGT002_PREVIEW_MODEL: "sonnet"                                                # [vercel]
AGT002_PREVIEW_POLICY_VERSION: "agt002-integral-v3-policy-v7"                 # [base] reanálisis más reciente (por confirmar)
AGT002_PREVIEW_TIMEOUT_MS: "285000"                                           # [base] (por confirmar)
AGT002_PREVIEW_DAILY_MAX_RUNS: "20"                                           # [base]
AGT002_PREVIEW_MAX_CONCURRENT: "1"                                            # [base]
AGT002_RADAR_GATE: "false"                                                    # (por confirmar) última corrida del radar en la base: 2026-09-25
AGT002_RADAR_VISIBILITY: "false"                                              # (por confirmar)

# Mesa Vig-IA (AGT-002)
AGT002_WORKBENCH_AGENT_ID: "a0020000-0000-4000-8000-000000000002"             # [vercel]
AGT002_WORKBENCH_DAILY_MAX_JOBS: "20"                                         # [vercel]
AGT002_WORKBENCH_DRAIN_ENABLED: "true"                                        # [vercel]
AGT002_WORKBENCH_MAX_CONCURRENT: "1"                                          # [vercel]
AGT002_WORKBENCH_MODEL: "sonnet"                                              # (por confirmar)
AGT002_WORKBENCH_RUNTIME: "agt002_workbench_bridge_v1"                        # [vercel]
AGT002_WORKBENCH_SWEEP_MAX: "25"                                              # [vercel]
AGT002_WORKBENCH_TIMEOUT_MS: "30000"                                          # [vercel]
AGT002_WORKBENCH_WORKER_ID: "agt002-workbench-cloudrun-prod"                  # propio de Cloud Run (Vercel usa agt002-workbench-vercel-prod)

# Copiloto comercial (AGT-003)
AGT003_COPILOT_ENGINE: "agt003_bridge_preview"                                # [código] AGT003_COPILOT_ENGINE_ID; hay corridas reales al 2026-11-19
AGT003_COPILOT_BRIDGE_URL: "https://agt003.5-78-140-24.sslip.io/v1/agt003-copilot/run"  # [infra]
AGT003_COPILOT_WIRE_PROTOCOL: "agt003"                                        # (por confirmar)
AGT003_COPILOT_MODEL: "sonnet"                                                # [base] corrida del 2026-11-19
AGT003_COPILOT_POLICY_VERSION: "agt003-opportunity-copilot-v1"                # [base] corrida del 2026-11-19
AGT003_COPILOT_TIMEOUT_MS: "110000"                                           # (por confirmar)
AGT003_COPILOT_DAILY_MAX_RUNS: "20"                                           # (por confirmar)
AGT003_COPILOT_MAX_CONCURRENT: "3"                                            # [vercel]

# Gerencia (AGT-001)
AGT001_BRIDGE_URL: "https://agt001.5-78-140-24.sslip.io/v1/agt003-copilot/run"  # [infra] el puente de AGT-001 corre el código del de AGT-003
AGT001_MODEL: "sonnet"                                                        # [código] valor por defecto

# Avancys (lectura)
AVANCYS_ODOO_URL: "https://seguridadnacional.avancyserp.com"                  # [infra] /root/.vigia-odoo
AVANCYS_ODOO_DATABASE: "seguridadnacional"                                    # [infra]
