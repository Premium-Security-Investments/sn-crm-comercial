# Configuración NO secreta del SIIO en Cloud Run (proyecto psi-siio, us-east5).
# Los secretos van aparte, en Secret Manager (ver deploy/cloud-run/README.md).
# Origen de cada valor, reconstruido el 2026-11-21 porque Vercel no deja leer las variables marcadas «sensitive»:
#   [vercel]   leído con `vercel env pull` (variables no sensibles de producción)
#   [base]     tomado de la base: lo que guardaron los análisis y corridas reales más recientes
#   [código]   valor por defecto del código o constante del contrato
#   [infra]    dirección conocida de la infraestructura
#   [confirmado]  comprobado contra Vercel el 2026-11-22 (evidencia en el comentario de cada línea)
#   [sin efecto]  el código ya no lee la variable o la reemplaza por una constante; se deja por paridad

# Node corta a 16 KB los encabezados de respuesta; algunas consultas a Supabase los superan (en Vercel el límite es mayor).
AGT002_BRIDGE_HOST: "agt002.136-83-22-156.sslip.io"                         # puentes en la máquina psi-agentes-1 de Google desde el 2026-11-21
NODE_OPTIONS: "--max-http-header-size=65536"

NEXT_PUBLIC_SUPABASE_URL: "https://tyfzjqzcpgwcjnxozaaf.supabase.co"          # [infra]

# Análisis de licitaciones (AGT-002)
TENDER_AUTO_ANALYSIS: "on"                                                    # [vercel]
TENDER_CONTINUOUS_DRAIN: "true"                                               # [vercel]
TENDER_IMMEDIATE_DISPATCH: "true"                                             # [vercel]
TENDER_ANALYSIS_ENGINE: "agt002_codex_preview"                                # [confirmado] reanálisis creados desde la pantalla 29-sep..3-oct (solo se encolan con este motor); en Vercel no cambia desde 2026-08-04
TENDER_DURABLE_PIPELINE: "on"                                                 # [confirmado] /api/tender-processing-worker-run sin firma: 403 en Vercel y en Cloud Run (apagado daría 404), 2026-11-22
TENDER_PUBLIC_UI: "on"                                                        # [confirmado] apagado quitaría el permiso licitaciones en pantalla; Katherine trabaja Licitaciones en Vercel
AGT002_CANONICAL_ONLY: "true"                                                 # [vercel]
AGT002_CONTEXT_V2: "true"                                                     # [vercel]
AGT002_DECISION_AXIS_SURFACE: "true"                                          # [vercel]
AGT002_DOCUMENT_RETRIEVAL: "true"                                             # [vercel]
AGT002_INTEGRAL_CONTRACT_V3: "true"                                           # [vercel]
AGT002_LEGAL_CORPUS: "true"                                                   # [vercel]
AGT002_MESA_CARPETA: "1"                                                      # [vercel]
AGT002_INITIAL_ANALYSIS_ADMISSION_ENABLED: "false"                            # [vercel]
AGT002_MODEL_CALLS_ENABLED: "false"                                           # [vercel]
AGT002_HETZNER_BRIDGE_URL: "https://agt002.136-83-22-156.sslip.io/v1/agt002-preview/run"  # [vercel]
AGT002_PREVIEW_MODEL: "sonnet"                                                # [vercel]
AGT002_PREVIEW_POLICY_VERSION: "agt002-integral-v3-policy-v7"                 # [sin efecto] con AGT002_INTEGRAL_CONTRACT_V3=true el código usa la constante AGT002_INTEGRAL_V3_POLICY_VERSION (igual a este valor)
AGT002_PREVIEW_TIMEOUT_MS: "285000"                                           # [confirmado] congelado en los reanálisis 29-sep..3-oct; en Vercel no cambia desde 2026-08-25
AGT002_PREVIEW_DAILY_MAX_RUNS: "20"                                           # [base]
AGT002_PREVIEW_MAX_CONCURRENT: "1"                                            # [base]
AGT002_RADAR_GATE: "false"                                                    # [sin efecto] retirada del código el 2026-09-28 (CURRENT.md §17); no se lee
AGT002_RADAR_VISIBILITY: "false"                                              # [sin efecto] retirada del código el 2026-09-28 (CURRENT.md §17); no se lee

